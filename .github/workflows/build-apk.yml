name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository and whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the build tools, the NDK and CMake
        run: >
          sdkmanager --install
          "platforms;android-35"
          "build-tools;35.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
